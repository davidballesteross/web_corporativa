<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodLogic | Futur Tecnològic</title>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-card: rgba(255, 255, 255, 0.05);
            --primary: #00f2ff;
            --secondary: #7000ff;
            --text-light: #e0e0e0;
            --accent: #ff007a;
            --font-main: 'Segoe UI', Roboto, sans-serif;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- BACKGROUND EFFECTS --- */
        .glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(112, 0, 255, 0.07) 0%, transparent 40%);
        }

        /* --- NAVEGACIÓ --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .nav-links a:hover {
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary);
        }

        /* --- HERO SECTION --- */
        #inici {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            background-blend-mode: overlay;
            background-color: rgba(0,0,0,0.7);
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0,242,255,0.3));
        }

        .hero-p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2rem;
            color: #b0b0b0;
        }

        /* --- SECCIONS --- */
        section {
            padding: 100px 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-align: center;
            position: relative;
        }

        h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: var(--primary);
            margin: 10px auto;
        }

        /* --- SERVEIS (Cards) --- */
        .grid-serveis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
        }

        .card h3 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        /* --- SOBRE NOSALTRES --- */
        .sobre-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .sobre-img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 20px var(--secondary);
        }

        /* --- CONTACTE (Formulari) --- */
        .contact-container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--primary);
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-submit {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }

        .btn-submit:hover {
            filter: brightness(1.2);
            letter-spacing: 1px;
        }

        /* --- FOOTER --- */
        footer {
            padding: 3rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: #666;
        }

        /* --- MOBILE ADAPTATION --- */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .sobre-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <header>
        <nav>
            <a href="#" class="logo">FoodLogic</a>
            <ul class="nav-links">
                <li><a href="#inici">Inici</a></li>
                <li><a href="#serveis">Serveis</a></li>
                <li><a href="#sobre-nosaltres">Sobre nosaltres</a></li>
                <li><a href="#contacte">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inici">
            <h1>FOODLOGIC</h1>
            <p class="hero-p">Arquitectures digitals d'avantguarda. Transformem el codi en el futur del teu negoci.</p>
            <a href="#serveis" class="btn-submit" style="text-decoration: none; width: auto;">Explorar el futur</a>
        </section>

        <section id="serveis">
            <h2>Serveis Avançats</h2>
            <div class="grid-serveis">
                <div class="card">
                    <h3>Intel·ligència Artificial</h3>
